apply plugin: 'com.android.application'

// 接收地址仅从本机构建环境读取，不把电脑IP硬编码进源码；未配置时禁止上传。
def logUploadUrl = System.getenv('INKWAVE_LOG_UPLOAD_URL') ?: ''
def logUploadHost = ''
if (logUploadUrl) {
    def endpoint = new URI(logUploadUrl)
    def octets = (endpoint.host ?: '').tokenize('.')
    def ipv4 = octets.size() == 4 && octets.every { it ==~ /\d{1,3}/ && it.toInteger() <= 255 }
    def lan = ipv4 && (octets[0] == '10' || (octets[0] == '192' && octets[1] == '168') || (octets[0] == '172' && octets[1].toInteger() in 16..31))
    if (!lan || endpoint.scheme != 'http' || endpoint.port != 8765 || endpoint.path != '/api/logs' || endpoint.userInfo || endpoint.query || endpoint.fragment) {
        throw new GradleException('INKWAVE_LOG_UPLOAD_URL必须为http://局域网IPv4:8765/api/logs')
    }
    logUploadHost = endpoint.host
}
def logUploadRes = layout.buildDirectory.dir('generated/res/logUpload')
def generateLogUploadSecurity = tasks.register('generateLogUploadSecurity') {
    inputs.property('host', logUploadHost)
    outputs.dir(logUploadRes)
    doLast {
        def xml = new File(logUploadRes.get().asFile, 'xml/log_upload_security.xml')
        xml.parentFile.mkdirs()
        def domain = logUploadHost ? "<domain-config cleartextTrafficPermitted=\"true\"><domain includeSubdomains=\"false\">${logUploadHost}</domain></domain-config>" : ''
        def usbDomain = '<domain-config cleartextTrafficPermitted="true"><domain includeSubdomains="false">127.0.0.1</domain></domain-config>'
        xml.text = "<?xml version=\"1.0\" encoding=\"utf-8\"?><network-security-config><base-config cleartextTrafficPermitted=\"false\"/>${domain}${usbDomain}</network-security-config>"
    }
}

android {
    namespace = "com.demoink.inkwave"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.demoink.inkwave"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 54
        versionName "1.0.54"
        resValue 'string', 'log_upload_url', logUploadUrl
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    sourceSets.main.res.srcDir(logUploadRes)
}
tasks.named('preBuild').configure { dependsOn(generateLogUploadSecurity) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
