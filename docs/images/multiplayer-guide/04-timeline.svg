<polyline class="line" points="373,140 394,140"/>
<rect x="395" y="105" width="128" height="70" rx="12" fill="#eaf2ff" stroke="#2463b8" stroke-width="1.5"/>
<text x="413" y="136" font-size="20" font-weight="700" style="fill:#2463b8">50 ms</text>
<polyline class="line" points="523,140 544,140"/>
<rect x="545" y="105" width="128" height="70" rx="12" fill="#eaf2ff" stroke="#2463b8" stroke-width="1.5"/>
