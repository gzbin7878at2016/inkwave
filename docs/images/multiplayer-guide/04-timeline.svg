<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="535" viewBox="0 0 1040 535" role="img" aria-labelledby="title desc">
<title id="title">图4 网络快照少一些 画面仍可连续</title><desc id="desc">20Hz快照与30/60FPS画面是两个不同节拍；数字为示意。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#657a92"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182c43} .note{fill:#50657e} .line{stroke:#657a92;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="1040" height="535" rx="18" fill="#f8fafc"/>
<text x="32" y="42" font-size="25" font-weight="700">图4 网络快照少一些 画面仍可连续</text>
<text x="32" y="72" font-size="16" class="note">20Hz快照与30/60FPS画面是两个不同节拍；数字为示意。</text>
<text x="45" y="132" font-size="19" class="note">小明发出的状态</text>
<rect x="245" y="105" width="128" height="70" rx="12" fill="#eaf2ff" stroke="#2463b8" stroke-width="1.5"/>
