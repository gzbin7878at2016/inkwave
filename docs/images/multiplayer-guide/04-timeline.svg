<text x="245" y="286" font-size="16" class="note">已知样本之间补出位置与动画，不是只在收包时画一帧。</text>
<rect x="45" y="340" width="450" height="130" rx="12" fill="#e6f6f0" stroke="#167357" stroke-width="1.5"/>
<text x="63" y="371" font-size="20" font-weight="700" style="fill:#167357">缓冲后再播放</text>
<text x="63" y="399" font-size="16">初始约100ms，当前自适应70～300ms</text>
<text x="63" y="423" font-size="16">多等一点样本，减少网络抖动</text>
<rect x="535" y="340" width="450" height="130" rx="12" fill="#fff4df" stroke="#986010" stroke-width="1.5"/>
<text x="553" y="371" font-size="20" font-weight="700" style="fill:#986010">暂时没新消息</text>
<text x="553" y="399" font-size="16">最多180ms有限外推，然后停住</text>
<text x="553" y="423" font-size="16">恢复后用平滑纠偏减少跳动</text>
<text x="32" y="515" font-size="14" class="note">INKWAVE · 现状与方案分开阅读 · 2026-10-28</text>
