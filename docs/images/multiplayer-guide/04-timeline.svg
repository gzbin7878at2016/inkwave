<polyline class="line" points="823,140 844,140"/>
<rect x="845" y="105" width="128" height="70" rx="12" fill="#eaf2ff" stroke="#2463b8" stroke-width="1.5"/>
<text x="863" y="136" font-size="20" font-weight="700" style="fill:#2463b8">200 ms</text>
<text x="45" y="251" font-size="19" class="note">小红画出的角色</text>
<circle cx="245" cy="245" r="9" fill="#167357"/>
<circle cx="293" cy="245" r="9" fill="#167357"/>
<circle cx="341" cy="245" r="9" fill="#167357"/>
<circle cx="389" cy="245" r="9" fill="#167357"/>
<circle cx="437" cy="245" r="9" fill="#167357"/>
