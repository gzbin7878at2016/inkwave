<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620" role="img" aria-labelledby="title desc">
<title id="title">图8 房主退出后的接管</title><desc id="desc">接管来自幸存客户端已收到的状态，不是云端保存的完整战场。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#657a92"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182c43} .note{fill:#50657e} .line{stroke:#657a92;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="1040" height="620" rx="18" fill="#f8fafc"/>
<text x="32" y="42" font-size="25" font-weight="700">图8 房主退出后的接管</text>
<text x="32" y="72" font-size="16" class="note">接管来自幸存客户端已收到的状态，不是云端保存的完整战场。</text>
<rect x="60" y="110" width="380" height="90" rx="12" fill="#fff4df" stroke="#986010" stroke-width="1.5"/>
<text x="78" y="141" font-size="20" font-weight="700" style="fill:#986010">① 原房主断开</text>
<text x="78" y="169" font-size="16">中继更新实际连接名单</text>
<rect x="600" y="110" width="380" height="90" rx="12" fill="#e6f6f0" stroke="#167357" stroke-width="1.5"/>
<text x="618" y="141" font-size="20" font-weight="700" style="fill:#167357">② 选择新房主</text>
<text x="618" y="169" font-size="16">仍在线且加入最早的成员</text>
<polyline class="line" points="440,155 600,155"/>
<rect x="463.0" y="128.0" width="114" height="24" rx="5" fill="#f8fafc"/>
<text x="520.0" y="145.0" text-anchor="middle" font-size="16">leave + host</text>
<rect x="600" y="300" width="380" height="145" rx="12" fill="#eaf2ff" stroke="#2463b8" stroke-width="1.5"/>
<text x="618" y="331" font-size="20" font-weight="700" style="fill:#2463b8">③ 新房主接管</text>
<text x="618" y="359" font-size="16">离开角色与原Bot → 本机模拟</text>
<text x="618" y="383" font-size="16">时钟 / 规则 / Boss → 接管</text>
<polyline class="line" points="790,200 790,300"/>
<rect x="733.0" y="236" width="114" height="24" rx="5" fill="#f8fafc"/>
<text x="790" y="253" text-anchor="middle" font-size="16">宣布身份变化</text>
<rect x="60" y="300" width="380" height="145" rx="12" fill="#f1ebff" stroke="#7045ad" stroke-width="1.5"/>
<text x="78" y="331" font-size="20" font-weight="700" style="fill:#7045ad">④ 其余客户端继续回放</text>
<text x="78" y="359" font-size="16">接收新所有者的状态</text>
<text x="78" y="383" font-size="16">平滑连接到新的时间轴</text>
<polyline class="line" points="600,373 440,373"/>
<rect x="471.0" y="346.0" width="98" height="24" rx="5" fill="#f8fafc"/>
<text x="520.0" y="363.0" text-anchor="middle" font-size="16">状态与事件</text>
<text x="60" y="500" font-size="18" class="note">例外：noBots地图移除离开角色；本机断线没有完整自动重连追赶流程。</text>
<text x="60" y="538" font-size="16" class="note">比赛静默阈值20s，大厅150s，清扫间隔4s；不是精确到秒的故障恢复承诺。</text>
<text x="32" y="600" font-size="14" class="note">INKWAVE · 现状与方案分开阅读 · 2026-10-28</text>
</svg>