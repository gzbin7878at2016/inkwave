<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
<title id="title">图9 Go改造有三种不同深度</title><desc id="desc">长期目标可选权威游戏服，先用兼容中继验证部署和回退。</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#657a92"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#182c43} .note{fill:#50657e} .line{stroke:#657a92;stroke-width:2;fill:none;marker-end:url(#arrow)}</style>
<rect width="1040" height="570" rx="18" fill="#f8fafc"/>
<text x="32" y="42" font-size="25" font-weight="700">图9 Go改造有三种不同深度</text>
<text x="32" y="72" font-size="16" class="note">长期目标可选权威游戏服，先用兼容中继验证部署和回退。</text>
<rect x="30" y="120" width="310" height="290" rx="12" fill="#e6f6f0" stroke="#167357" stroke-width="1.5"/>
<text x="48" y="151" font-size="20" font-weight="700" style="fill:#167357">A 兼容中继</text>
<text x="48" y="179" font-size="16">Go接连接、房间、选主和转发</text>
<text x="48" y="203" font-size="16">现有客户端继续模拟</text>
<text x="48" y="227" font-size="16">可自托管与Docker运行</text>
<text x="48" y="251" font-size="16">房主依然负责Bot / Boss</text>
<rect x="365" y="120" width="310" height="290" rx="12" fill="#fff4df" stroke="#986010" stroke-width="1.5"/>
<text x="383" y="151" font-size="20" font-weight="700" style="fill:#986010">B 过渡架构</text>
<text x="383" y="179" font-size="16">Go再接大厅规则与发令</text>
<text x="383" y="203" font-size="16">部分状态校验集中</text>
<text x="383" y="227" font-size="16">玩法仍可能信任客户端</text>
<text x="383" y="251" font-size="16">每个状态只保留一个裁决者</text>
<rect x="700" y="120" width="310" height="290" rx="12" fill="#eaf2ff" stroke="#2463b8" stroke-width="1.5"/>
<text x="718" y="151" font-size="20" font-weight="700" style="fill:#2463b8">C 权威游戏服</text>
<text x="718" y="179" font-size="16">Go接移动、碰撞和伤害</text>
<text x="718" y="203" font-size="16">Bot / Boss / 计分由Go运行</text>
<text x="718" y="227" font-size="16">客户端发输入并做预测</text>
<text x="718" y="251" font-size="16">需要玩法移植和一致性验证</text>
<text x="50" y="473" font-size="20" class="note">更换服务器语言 ≠ 自动改变权威；容器化 ≠ 自动完成游戏逻辑迁移。</text>
<text x="32" y="550" font-size="14" class="note">INKWAVE · 现状与方案分开阅读 · 2026-10-28</text>
</svg>